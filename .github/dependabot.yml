version: 2
# Weekly automated dependency-vulnerability PRs. Catches things like the OpenCV-5
# "hollow module" break and any CVE in the Python or GitHub-Actions dependencies.
updates:
  - package-ecosystem: pip
    directory: "/"                       # inference image deps (requirements.txt)
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/Bettersnap-aI_Backend"  # Functions app deps
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
