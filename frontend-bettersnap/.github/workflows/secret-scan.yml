name: Secret scan

# Blocks any secret from being committed to the frontend bundle/repo — this is where
# the old Supabase anon key leaked, so scanning here matters most. Scans the working
# tree (--no-git) so it flags secrets present now, without failing on the already-known
# key in old history (that project is being decommissioned separately).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install + run gitleaks
        run: |
          URL=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep browser_download_url | grep linux_x64.tar.gz | cut -d '"' -f4)
          curl -sSL "$URL" | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --exit-code 1
